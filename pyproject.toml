[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ekg"
version = "0.1.0"
description = "Verifiable event graph construction and successor-event reasoning (CGEP)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "TJK" }]
keywords = [
    "event-graph",
    "event-relation-extraction",
    "event-factuality",
    "reliable-reasoning",
    "llm",
]

# ---------------------------------------------------------------------------
# core = CPU-only contracts, metrics, graph algorithms, heuristic baselines.
# Everything here installs and runs locally WITHOUT a GPU or torch.
# ---------------------------------------------------------------------------
dependencies = [
    "numpy>=1.26,<2.0",
    "networkx>=3.2",
    "scikit-learn>=1.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# llm = GPU stack for neural relation/succession components (server only, CUDA 12.8).
# torch 2.8.0+cu128 is the single stack that runs on BOTH GPU servers: its wheel
# ships sm_120 (5090 Blackwell) which cu124 lacks entirely, plus sm_86 which the
# 4090 (sm_89 Ada) runs under same-major binary compatibility -- no PyTorch wheel
# has ever shipped a dedicated sm_89. Changing these pins means re-verifying both
# servers. Verified: 2026-07-27 on the 5090 (real matmul on sm_120).
llm = [
    "torch==2.8.0",
    # transformers is capped below 4.54: Qwen3 support lands in 4.51, while trl
    # 0.18.x / peft expect the 4.5x line. transformers 5.x removes symbols peft
    # imports (e.g. BloomPreTrainedModel), so an unpinned `<6` resolves to a
    # broken combo on the server.
    "transformers>=4.51,<4.54",
    "peft>=0.11,<0.16",
    "accelerate>=0.33,<1.6",
    "bitsandbytes>=0.43",
    "datasets>=2.19,<4",
]
# gnn = compatibility/future graph-model stack (server only). No current v6
# headline experiment should require it unless its phase contract says so.
gnn = [
    "torch==2.8.0",
    "torch-geometric>=2.6",
]
# NOTE: the `serve` (vllm) and `rl` (trl/GRPO) extras were removed -- vllm on
# 2026-07-27 with the move to the cu128 stack, trl on 2026-07-29 when the whole
# generative extraction line was archived (docs/ARCHIVE_INDEX.md). No v6 chapter
# needs either. If one is ever needed again, build a separate venv rather than
# bending this stack: vllm hard-pins an exact torch and wants transformers>=4.55,
# which cannot coexist with the 4.53.3 that wrote the Phase A checkpoint.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
ekg-smoke = "ekg.cli:run_smoke"

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------
[tool.uv]
# Local development installs only `core + dev` (no torch). Server environments are
# pre-provisioned; do not run `uv sync` or `uv run` there (see docs/GPU_RUNBOOK.md).
default-groups = []

# Default index = Tsinghua TUNA mirror (fast/reliable in CN). Override per-machine
# with UV_DEFAULT_INDEX if needed.
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# torch + cu128 wheels come from the official PyTorch index. This index is
# `explicit`, so it is consulted ONLY for the packages mapped below — a plain
# local `uv sync` never touches it. PyPI's default torch 2.8.0 linux wheel is
# already cu128, so the TUNA mirror also serves a usable build.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

# ---------------------------------------------------------------------------
# tooling
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/ekg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --import-mode=importlib"
markers = [
    "gpu: tests that require torch / a CUDA device (skipped locally)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [
    "data/raw",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
